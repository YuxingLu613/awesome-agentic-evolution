name: Suggest a resource
description: Propose a tool, repository, paper, article, or technical discussion
title: "[Resource]: "
labels:
  - resource
body:
  - type: dropdown
    id: resource_type
    attributes:
      label: Resource type
      options:
        - Tool or repository
        - Paper
        - Benchmark or dataset
        - Article or technical post
        - Talk, podcast, or course
        - Community discussion
    validations:
      required: true
  - type: input
    id: canonical_url
    attributes:
      label: Canonical URL
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: evolution_target
    attributes:
      label: Primary evolution target
      options:
        - Parameters
        - Memory
        - Knowledge
        - Skills
        - Tools
        - Topology
        - Co-evolution
    validations:
      required: true
  - type: checkboxes
    id: secondary_targets
    attributes:
      label: Secondary evolution targets
      description: Select only artifacts that are updated independently in the reported system.
      options:
        - label: Parameters
        - label: Memory
        - label: Knowledge
        - label: Skills
        - label: Tools
        - label: Topology
        - label: Co-evolution
  - type: textarea
    id: feedback_signal
    attributes:
      label: Feedback or optimization signal
      description: What evidence, reward, verifier, critique, or environmental signal drives the update?
    validations:
      required: true
  - type: textarea
    id: persistent_artifact
    attributes:
      label: Persistent artifact
      description: What is changed or retained so that future behavior can improve?
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation evidence
      description: Link the benchmark, held-out protocol, baselines, results, or other primary evidence.
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Link public code, data, logs, or instructions, and note anything you verified yourself.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, regressions, and rollback
      description: Note relevant failure modes, isolation requirements, regression checks, or rollback mechanisms. Write "Not discussed" if absent.
    validations:
      required: true
  - type: dropdown
    id: conflict_of_interest
    attributes:
      label: Relationship to this resource
      options:
        - I have no affiliation with this work
        - I am an author or contributor
        - I maintain the project or artifact
        - I am affiliated with the responsible organization
        - Other relationship disclosed in the issue
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that this resource is not already listed.
          required: true
        - label: I used a canonical or primary-source URL.
          required: true
        - label: The resource describes persistent improvement, not only one-shot refinement.
          required: true
        - label: I disclosed my relationship to the submitted work.
          required: true
